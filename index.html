<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FROSYA</title>

    <meta name="description" content="Сайт FROSYA.">
    <meta name="theme-color" content="#714950">

    <!-- Превью при отправке ссылки -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="FROSYA">
    <meta property="og:description" content="Сайт FROSYA.">
    <meta property="og:url" content="https://syavalukich.github.io/frosyasoft.io/">
    <meta property="og:image" content="https://syavalukich.github.io/frosyasoft.io/logo.png">

    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>

    <!-- Шапка сайта -->
    <header>
        <picture>
            <source srcset="logo.webp" type="image/webp">
            <img class="logo" src="logo.png" alt="FROSYA" width="810" height="270">
        </picture>
    </header>

    <!-- Главный блок -->
    <main class="hero">
        <h1 class="title" id="title" aria-live="polite">Добро пожаловать</h1>
        <p class="counter" id="counter">Нажатий: 0</p>

        <!-- 🧊 3D-куб -->
        <button class="cube-scene" id="cube" type="button"
                title="Нажми на меня" aria-label="Крутящийся куб, нажми — покажу, сколько раз ты нажал">
            <span class="cube">
                <span class="cube-face front"></span>
                <span class="cube-face back"></span>
                <span class="cube-face right"></span>
                <span class="cube-face left"></span>
                <span class="cube-face top"></span>
                <span class="cube-face bottom"></span>
            </span>
        </button>
    </main>

</body>
</html>
