<html lang="ru"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FROSYA</title>

    <style>
        /* ===== Общие стили ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            line-height: 1.6;
            color: #2b2b2b;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* ===== Бесконечно прокручивающийся фон ===== */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('mbackground.png');
            background-size: 200px 200px;
            background-repeat: repeat;
            background-position: 0 0;
            z-index: -1;
            animation: bgScroll 5s linear infinite;
        }

        @keyframes bgScroll {
            from { background-position: 0 0; }
            to   { background-position: -200px -200px; }
        }

        /* ===== Шапка ===== */
        header {
            background: rgb(210 210 210);
            padding: 0;
            display: flex;
            justify-content: left;
            align-items: center;
            border-radius: 0 0 20px 20px;
            outline: 8px solid #714950;
        }

        .logo-img {
            height: 90px;
            width: auto;
            display: block;
        }

        /* ===== Главный блок ===== */
        .hero {
            text-align: center;
            padding: 90px;
            border-radius: 0 0 20px 20px;
            margin: 0 15px;
        }

        .hero h1 {
            font-size: 42px;
            margin-bottom: 15px;
            transition: transform 0.3s, color 0.3s;
            min-height: 60px; /* чтобы вёрстка не прыгала, когда текст пустой */
        }

        /* Анимация «вспышки» при смене заголовка */
        .hero h1.flash {
            transform: scale(1.15);
            color: #7b3ff2;
        }

        .hero p {
            font-size: 18px;
            color: #444;
            max-width: 600px;
            margin: 0 auto 30px;
        }

        /* ===== Подвал ===== */
        footer {
            text-align: center;
            padding: 25px;
            background: rgba(43, 43, 43, 0.9);
            color: #bbb;
            font-size: 14px;
        }

        /* ===== 🧊 3D-КУБ ===== */
        .cube-scene {
            width: 160px;
            height: 160px;
            margin: 100px auto;
            perspective: 700px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .cube {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            animation: rotateCube 12s linear infinite,
            moveCube 12s linear infinite;
        }

        .cube-face {
            position: absolute;
            width: 160px;
            height: 160px;

            /* Градиент + текстура в одном фоне: градиент полупрозрачный поверх текстуры */
            background-image: url('texture.png');
            background-size: cover;
            background-position: center;

            border: 2px solid rgba(255, 255, 255, 0.85);
            box-shadow: 0 0 25px rgba(123, 63, 242, 0.5) inset;

            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;

            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 42px;
            color: #fff;
            user-select: none;
        }

        .front  { transform: translateZ(80px); }
        .back   { transform: rotateY(180deg) translateZ(80px); }
        .right  { transform: rotateY(90deg)  translateZ(80px); }
        .left   { transform: rotateY(-90deg) translateZ(80px); }
        .top    { transform: rotateX(90deg)  translateZ(80px); }
        .bottom { transform: rotateX(-90deg) translateZ(80px); }

        @keyframes rotateCube {
            0%   { transform: rotateX(0deg)   rotateY(0deg); }
            100% { transform: rotateX(360deg) rotateY(360deg); }
        }
        @keyframes moveCube {
            0%   { transform: translatey(30 px ); }
            100% { transform: translatey(-30 px ); }
        }
    </style>
</head>
<body>

    <!-- Шапка сайта -->
    <header>
        <img src="logo.png" alt="FROSYA Logo" class="logo-img">
    </header>

    <!-- Главный блок -->
    <section class="hero" id="home">
        <h1 id="text"></h1>
        <p id="click-counter">Нажатий: 0</p>

        <!-- 🧊 3D-КУБ -->
        <div class="cube-scene" onclick="sayHello()" title="Нажми на меня">
            <div class="cube">
                <div class="cube-face front">&nbsp;</div>
                <div class="cube-face back">&nbsp;</div>
                <div class="cube-face right">&nbsp;</div>
                <div class="cube-face left">&nbsp;</div>
                <div class="cube-face top">&nbsp;</div>
                <div class="cube-face bottom">&nbsp;</div>
            </div>
        </div>
    </section>

    <script>
        const messages = {
            10:  'В туманной тишине ночной',
            50:  'Вспоминаю свои дни беззаботные',
            100: 'Десять! Ты в деле 💪',
            25:  'Двадцать пять — серьёзный подход!',
            50:  'Полтинник! 🎉',
            100: 'Ночь',
            300: 'Спроси у тракториста'
        };

        let clickCount = 0;
        const text1 = document.getElementById('text');
        text1.textContent = 'Добро Пожаловать';
        const counterEl = document.getElementById('click-counter');

        function sayHello() {
            // Анимация «подпрыгивания» куба
            const cube = document.querySelector('.cube-scene');
            cube.animate([
                { transform: 'scale(1)' },
                { transform: 'scale(1.2)' },
                { transform: 'scale(1)' }
            ], { duration: 300, easing: 'ease-out' });

            // Считаем клик
            clickCount++;

            // Обновляем счётчик
            counterEl.textContent = 'Нажатий: ' + clickCount;

            // Если число есть в словаре — меняем заголовок
            if (messages[clickCount]) {
                text1.textContent = messages[clickCount];

                // Короткая анимация вспышки
                text1.classList.add('flash');
                setTimeout(() => text1.classList.remove('flash'), 300);
            }
        }
    </script>

</body></html>
